name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.service }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [etl, model]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - name: Install pinned dependencies
        run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      # Postgres integration cases skip automatically when POSTGRES_* is unset.
      - name: Run tests
        run: python -m pytest services/${{ matrix.service }}/tests -q
